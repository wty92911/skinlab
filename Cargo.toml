[workspace]
resolver = "3"
members = ["crates/skinlab-core", "crates/skinlab-session", "app", "xtask"]


[workspace.package]
version = "0.5.4"
edition = "2024"
rust-version = "1.85"
publish = false
license = "PolyForm-Noncommercial-1.0.0"
repository = "https://github.com/wty92911/skinlab"

[workspace.dependencies]
skinlab-core = { path = "crates/skinlab-core" }
skinlab-session = { path = "crates/skinlab-session" }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tracing = "0.1"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
