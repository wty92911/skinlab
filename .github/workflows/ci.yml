name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  rust:
    name: Rust checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Install Tauri Linux dependencies
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  windows:
    name: Windows build and fixture verify
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - uses: msys2/setup-msys2@v2
        id: msys2
        with:
          msystem: MINGW64
          install: mingw-w64-x86_64-gcc
      - name: Put MinGW-w64 on PATH
        shell: pwsh
        run: Add-Content $env:GITHUB_PATH "${{ steps.msys2.outputs.msys2-location }}\mingw64\bin"
      # The app bundles out/session, so the native build comes first on Windows.
      - name: Build native bundle
        run: cargo xtask native
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - name: Verify against the owned WARP fixture
        run: cargo xtask verify
      - name: Cache Tauri bundler tools
        uses: actions/cache@v4
        with:
          path: ~/AppData/Local/tauri
          key: tauri-tools-windows-v1
      - name: Build installer
        working-directory: app
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          for ($attempt = 1; $attempt -le 3; $attempt++) {
            $buildOutput = & npx --yes @tauri-apps/cli@2 build 2>&1
            $buildExit = $LASTEXITCODE
            $buildOutput | ForEach-Object { Write-Host $_ }
            if ($buildExit -eq 0) { exit 0 }
            $transientDownload = ($buildOutput -join "`n") -match 'http status: (429|5\d\d)|connection reset|connection timed out|error sending request for url'
            if (!$transientDownload -or $attempt -eq 3) { exit $buildExit }
            Write-Host "Transient bundler download failure; retrying ($attempt/3)."
            Start-Sleep -Seconds 5
          }
      - uses: actions/upload-artifact@v4
        with:
          name: skinlab-windows
          path: |
            target/release/bundle/nsis/*.exe
            out/session/build-manifest.json

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [rust, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/download-artifact@v4
        with:
          name: skinlab-windows
          path: artifact
      - name: Collect files
        run: |
          mkdir dist
          cp artifact/target/release/bundle/nsis/*.exe dist/
          cp artifact/out/session/build-manifest.json dist/native-build-manifest.json
          (cd dist && sha256sum * > SHA256SUMS.txt)
          cat dist/SHA256SUMS.txt
      - name: Release notes
        run: cargo xtask release-notes "$GITHUB_REF_NAME" > notes.md
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=()
          [[ "$GITHUB_REF_NAME" == *-* ]] && flags+=(--prerelease)
          gh release create "$GITHUB_REF_NAME" dist/* --title "SkinLab $GITHUB_REF_NAME" --notes-file notes.md --verify-tag "${flags[@]}"
